# Every push to master builds the site on GitHub (Linux) and ships it to Hostinger over SSH: once per
# site in the matrix below, each with its own home variant (NEXT_PUBLIC_HOME). Both sites share the one
# data folder on the host, so leads from either land in the same admin.
# Needs one repository secret: HOSTINGER_SSH_KEY (the private deploy key whose public half is on the host).
name: Deploy to Hostinger
on:
  push:
    branches: [master]
  workflow_dispatch:
env:
  HOST: u768758130@157.173.209.88
  PORT: "65002"
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # one row per look. The calm domain is named below; a CALM_SITE repository variable overrides it
        # (the vars context is not allowed inside a matrix, so the name is resolved in a step)
        home: ["", "calm"]
    env:
      NEXT_PUBLIC_HOME: ${{ matrix.home }}
    steps:
      - name: Pick this look's site
        id: site
        env:
          CALM_SITE: ${{ vars.CALM_SITE }}
        run: |
          if [ "${{ matrix.home }}" = "calm" ]; then S="${CALM_SITE:-cyan-rhinoceros-347269.hostingersite.com}"; else S="lightcoral-penguin-341733.hostingersite.com"; fi
          echo "name=$S" >> "$GITHUB_OUTPUT"
          [ -n "$S" ] && echo "deploying home='${{ matrix.home }}' to $S" || echo "no domain for home='${{ matrix.home }}' - skipping"
      - uses: actions/checkout@v4
        if: steps.site.outputs.name != ''
      - uses: actions/setup-node@v4
        if: steps.site.outputs.name != ''
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.site.outputs.name != ''
      - run: npm run build
        if: steps.site.outputs.name != ''
      - name: Pack the standalone app
        if: steps.site.outputs.name != ''
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp scripts/deploy/start.js .next/standalone/start.js
          tar --exclude=./.data -czf deploy.tgz -C .next/standalone .
      - name: Ship
        if: steps.site.outputs.name != ''
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          scp -P $PORT -o StrictHostKeyChecking=no -o BatchMode=yes deploy.tgz scripts/deploy/remote.sh $HOST:domains/${{ steps.site.outputs.name }}/
          ssh -p $PORT -o StrictHostKeyChecking=no -o BatchMode=yes $HOST "bash domains/${{ steps.site.outputs.name }}/remote.sh ${{ steps.site.outputs.name }} && rm domains/${{ steps.site.outputs.name }}/remote.sh"
      - name: Check the site answers
        if: steps.site.outputs.name != ''
        run: |
          sleep 15
          for i in 1 2 3 4 5 6; do c=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ steps.site.outputs.name }}/en"); echo "/en -> $c"; [ "$c" = 200 ] && exit 0; sleep 10; done; exit 1
